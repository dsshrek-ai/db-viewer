<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Viewer</title>
<style>
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-text: #1c2126;
    --color-primary: #2b5a8a;
    --color-primary-dark: #1d3f61;
    --color-border: #dde1e6;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.4;
  }
  header {
    background: var(--color-primary-dark);
    color: #fff;
    padding: 1rem 1.25rem;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 0.25rem 0 0; font-size: 0.9rem; opacity: 0.85; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
    max-width: 420px;
  }
  .card.wide { max-width: none; }
  label { display: block; font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.25rem; }
  input[type="email"], input[type="password"], input[type="number"], select {
    font-size: 1rem;
    padding: 0.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    width: 100%;
  }
  .btn {
    display: inline-block;
    background: var(--color-primary);
    color: #fff;
    border: none;
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius);
    font-size: 1rem;
    cursor: pointer;
    margin-top: 0.9rem;
  }
  .btn:hover { background: var(--color-primary-dark); }
  .btn:disabled { background: #9aa4af; cursor: not-allowed; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; }
  .toolbar > div { flex: 1; min-width: 180px; }
  .filter-bar { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-border); }
  .filter-bar input[type="text"] {
    font-size: 1rem;
    padding: 0.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    width: 100%;
  }
  mark { background: #fff1a8; padding: 0 0.1em; }
  .error-msg { color: #9b2020; margin-top: 0.6rem; }
  .status-msg { color: #4a4f55; margin-top: 0.6rem; }
  .table-wrap { overflow-x: auto; margin-top: 1rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td {
    border: 1px solid var(--color-border);
    padding: 0.4rem 0.6rem;
    text-align: left;
    white-space: nowrap;
  }
  th { background: #eef1f4; position: sticky; top: 0; }
  #logoutBtn { float: right; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <button class="btn hidden" id="logoutBtn">Log Out</button>
  <h1>DB Viewer</h1>
  <p>Admin-only — dumps any real table in MyDataWorld.</p>
</header>
<main>
  <div id="loginCard" class="card">
    <h2>Log In</h2>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label for="loginPw">Password</label>
    <input type="password" id="loginPw" autocomplete="current-password">
    <button class="btn" id="loginBtn">Log In</button>
    <div id="loginMsg"></div>
  </div>

  <div id="viewerCard" class="card wide hidden">
    <div class="toolbar">
      <div>
        <label for="tableSelect">Table</label>
        <select id="tableSelect"></select>
      </div>
      <div style="flex: 0 0 120px;">
        <label for="limitInput">Row limit</label>
        <input type="number" id="limitInput" value="500" min="1" max="2000">
      </div>
      <div style="flex: 0 0 auto;">
        <button class="btn" id="loadBtn">Load</button>
      </div>
    </div>
    <div id="dumpMsg" class="status-msg"></div>

    <div id="filterBar" class="toolbar filter-bar hidden">
      <div>
        <label for="searchInput">Search everywhere</label>
        <input type="text" id="searchInput" placeholder="Filter as you type…">
      </div>
      <div style="flex: 0 0 160px;">
        <label for="filterField">Field</label>
        <select id="filterField"><option value="">(none)</option></select>
      </div>
      <div style="flex: 0 0 90px;">
        <label for="filterOp">Op</label>
        <select id="filterOp">
          <option value="=">=</option>
          <option value="<>">&lt;&gt;</option>
        </select>
      </div>
      <div>
        <label for="filterValue">Value</label>
        <input type="text" id="filterValue" placeholder="Value to match…">
      </div>
      <div style="flex: 0 0 auto;">
        <button class="btn" id="clearFiltersBtn" type="button">Clear</button>
      </div>
    </div>

    <div id="filterMsg" class="status-msg"></div>
    <div id="dumpResult" class="table-wrap"></div>
  </div>
</main>
<script>
  const API_URL = "https://seniorfamily.org/db-viewer-api/api.php";
  const AUTH_KEY = 'dbViewerAuth';
  let auth = null; // { token, displayName }

  function loadAuth() { try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)); } catch { return null; } }
  function saveAuth(a) { sessionStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
  function clearAuth() { sessionStorage.removeItem(AUTH_KEY); }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function authHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (auth && auth.token) headers['Authorization'] = `Bearer ${auth.token}`;
    return headers;
  }

  async function callApi(action, { method = 'GET', params = {}, body } = {}) {
    const url = new URL(API_URL);
    if (method === 'GET') {
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    }
    const res = await fetch(url, {
      method,
      headers: authHeaders(),
      body: method === 'POST' ? JSON.stringify({ action, ...(body || {}) }) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed: ${res.status}`);
    return data;
  }

  const loginCard = document.getElementById('loginCard');
  const viewerCard = document.getElementById('viewerCard');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginMsg = document.getElementById('loginMsg');
  const tableSelect = document.getElementById('tableSelect');
  const dumpMsg = document.getElementById('dumpMsg');
  const dumpResult = document.getElementById('dumpResult');

  function showLogin(message) {
    clearAuth();
    auth = null;
    loginCard.classList.remove('hidden');
    viewerCard.classList.add('hidden');
    logoutBtn.classList.add('hidden');
    loginMsg.innerHTML = message ? `<div class="error-msg">${escapeHtml(message)}</div>` : '';
  }

  async function showViewer() {
    loginCard.classList.add('hidden');
    viewerCard.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    try {
      const { tables } = await callApi('tables');
      tableSelect.innerHTML = tables.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    } catch (e) {
      dumpMsg.innerHTML = `<div class="error-msg">Couldn't load the table list: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function attemptLogin() {
    const username = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPw').value;
    loginMsg.innerHTML = '';
    if (!username || !password) return;
    try {
      const data = await callApi('login', { method: 'POST', body: { username, password } });
      auth = { token: data.token, displayName: data.displayName || username };
      saveAuth(auth);
      await showViewer();
    } catch (e) {
      loginMsg.innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  document.getElementById('loginPw').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') attemptLogin(); });

  logoutBtn.addEventListener('click', async () => {
    try { await callApi('logout', { method: 'POST', body: { token: auth.token } }); } catch (e) {}
    showLogin();
  });

  // ---- Quick filters, applied client-side against the already-loaded rows
  // (never re-queried) -- both filters compose: search narrows first, then
  // the field/op/value pick narrows further.

  const filterBar = document.getElementById('filterBar');
  const filterMsg = document.getElementById('filterMsg');
  const searchInput = document.getElementById('searchInput');
  const filterField = document.getElementById('filterField');
  const filterOp = document.getElementById('filterOp');
  const filterValue = document.getElementById('filterValue');

  let allRows = [];
  let allCols = [];

  function highlightMatch(text, needle) {
    const safe = escapeHtml(text);
    if (!needle) return safe;
    const idx = safe.toLowerCase().indexOf(needle.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + needle.length) + '</mark>' + safe.slice(idx + needle.length);
  }

  function renderRows(rows, cols, searchTerm) {
    if (!rows.length) {
      dumpResult.innerHTML = '';
      filterMsg.textContent = allRows.length ? 'No rows match this filter.' : '';
      return;
    }
    filterMsg.textContent = rows.length === allRows.length
      ? ''
      : `Showing ${rows.length} of ${allRows.length} row(s).`;
    dumpResult.innerHTML = `
      <table>
        <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map(r => `<tr>${cols.map(c => `<td>${highlightMatch(r[c], searchTerm)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  function applyFilters() {
    if (!allRows.length) return;
    const search = searchInput.value.trim().toLowerCase();
    const field = filterField.value;
    const op = filterOp.value;
    const value = filterValue.value.trim().toLowerCase();

    let rows = allRows;

    if (search) {
      rows = rows.filter(r => allCols.some(c => String(r[c] ?? '').toLowerCase().includes(search)));
    }

    if (field && value) {
      rows = rows.filter(r => {
        const cell = String(r[field] ?? '').toLowerCase();
        return op === '=' ? cell === value : cell !== value;
      });
    }

    renderRows(rows, allCols, search);
  }

  [searchInput, filterField, filterOp, filterValue].forEach(el => {
    el.addEventListener('input', applyFilters);
    el.addEventListener('change', applyFilters);
  });

  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    searchInput.value = '';
    filterField.value = '';
    filterOp.value = '=';
    filterValue.value = '';
    applyFilters();
  });

  document.getElementById('loadBtn').addEventListener('click', async () => {
    const table = tableSelect.value;
    const limit = document.getElementById('limitInput').value || 500;
    if (!table) return;
    dumpMsg.textContent = 'Loading…';
    filterMsg.textContent = '';
    dumpResult.innerHTML = '';
    filterBar.classList.add('hidden');
    allRows = [];
    allCols = [];
    try {
      const data = await callApi('dump', { params: { table, limit } });
      dumpMsg.textContent = `${data.rowCount} row(s) — table: ${data.table}${data.rowCount >= data.limit ? ` (capped at ${data.limit})` : ''}`;
      if (!data.rows.length) {
        dumpResult.innerHTML = '';
        return;
      }
      allRows = data.rows;
      allCols = Object.keys(data.rows[0]);
      filterField.innerHTML = '<option value="">(none)</option>' +
        allCols.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      searchInput.value = '';
      filterField.value = '';
      filterOp.value = '=';
      filterValue.value = '';
      filterBar.classList.remove('hidden');
      renderRows(allRows, allCols, '');
    } catch (e) {
      dumpMsg.innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
      if (/session|authoriz/i.test(e.message)) showLogin('Your saved login stopped working. Please log in again.');
    }
  });

  (async () => {
    auth = loadAuth();
    if (!auth) { showLogin(); return; }
    try {
      await callApi('checkAccess');
      await showViewer();
    } catch (e) {
      showLogin();
    }
  })();
</script>
</body>
</html>
